services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: drupal
      MYSQL_USER: drupal
      MYSQL_PASSWORD: drupal
      MYSQL_ROOT_PASSWORD: drupal
    volumes:
      - db_data:/var/lib/mysql

  app:
    image: drupal:11-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8084:80"
    volumes:
      - ./site:/opt/drupal
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

volumes:
  db_data: {}


