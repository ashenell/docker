services:
  db:
    image: postgres:18-alpine
    container_name: test-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U associationbilling -d associationbilling"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
